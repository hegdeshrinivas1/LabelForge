version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: labelforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: labelforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labelforge_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      APP_NAME: LabelForge
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/labelforge
      SECRET_KEY: labelforge_super_secret_docker_compose_production_key_12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_URL: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Vite Frontend (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labelforge_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
